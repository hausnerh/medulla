[general]
output = "gOre_1g1p_sidebands"
fsthresh = [
  "@gOre_threshold",
  "@gOre_threshold",
  "@muon_threshold",
  "@pion_threshold",
  "@proton_threshold",
]
pidfn = "gOre_pid"

[parameters]
gOre_threshold   = 25 # MeV
muon_threshold   = 25 # MeV
pion_threshold   = 25 # MeV
proton_threshold = 50 # MeV
flash_low_t      =  0.0 # µs
flash_high_t     =  1.6 # µs
fiducial_xdist_pos = 50 # cm
fiducial_xdist_neg = 50 # cm
fiducial_ydist_pos = 50 # cm
fiducial_ydist_neg = 50 # cm
fiducial_zdist_pos = 50 # cm
fiducial_zdist_neg = 50 # cm
pion_mass_threshold = 0.4
photon_vertex_resolution = 150
flash_pe_neutron_scaling = 0.019
angle_neutron_scaling    = 1.31
# pi0 rejection thresholds
gOre_primary_softmax_min   = 0.999100
proton_primary_softmax_min = 0.951300
delta_mass_center          = 1232.0
delta_mass_halfwidth       = 59.700000
# e/γ separation thresholds
start_dedx_min          = 4.070000
axial_spread_min        = -0.500000
directional_spread_max  = 0.037000
photon_softmax_min      = 0.922500
# CC-sideband flag: pass as the 5th param to pi0_rejection / egamma_separation
# so they tolerate the CC muon (gate on a single photon shower instead of the
# no-lepton `is_valid`). Only the cc_Xg1p stage2/3 trees use it.
sideband_allow_leptons  = 1
# N-1 (cut-minus-one) no-op thresholds: pass one of these to pi0_rejection in
# place of the real threshold to disable exactly that sub-cut while leaving the
# rest live, so the freed variable spans both sides of its cut. -1 makes the
# `primary_softmax > x` test always pass; 1e6 makes the `|Δm-1232| < w` window
# always pass. Kept as @-params so the parameter arrays stay all-string.
gOre_primary_softmax_off = -1.0
delta_mass_halfwidth_off = 1000000.0

# -----------------------------------------------------------------------------
# Truth categories (unchanged from gOre_1g0p_1g1p_1gNp.toml).
# -----------------------------------------------------------------------------
[[category]] # 0: NC Δ→Nγ (1γ1p)
cuts = [
  { name = "neutrino"                                                                  },
  { name = "!iscc",            type = "mctruth"                                         },
  { name = "is_resonance",     type = "mctruth", parameters = [ 0 ]                     },
  { name = "single_photon",    type = "mctruth", parameters = [ "@gOre_threshold" ]     },
  { name = "no_charged_pions", type = "mctruth", parameters = [ "@pion_threshold" ]     },
  { name = "no_neutral_pions", type = "mctruth"                                         },
  { name = "no_electrons",     type = "mctruth", parameters = [ "@gOre_threshold" ]     },
  { name = "no_muons",         type = "mctruth", parameters = [ "@muon_threshold" ]     },
  { name = "single_proton",    type = "mctruth", parameters = [ "@proton_threshold" ]   },
]
[[category]] # 1: NC Δ→Nγ (other proton multiplicity)
cuts = [
  { name = "neutrino"                                                                  },
  { name = "!iscc",            type = "mctruth"                                         },
  { name = "is_resonance",     type = "mctruth", parameters = [ 0 ]                     },
  { name = "single_photon",    type = "mctruth", parameters = [ "@gOre_threshold" ]     },
  { name = "no_charged_pions", type = "mctruth", parameters = [ "@pion_threshold" ]     },
  { name = "no_neutral_pions", type = "mctruth"                                         },
  { name = "no_electrons",     type = "mctruth", parameters = [ "@gOre_threshold" ]     },
  { name = "no_muons",         type = "mctruth", parameters = [ "@muon_threshold" ]     },
]
[[category]] # 2: Other NC 1γXp post-FSI
cuts = [
  { name = "neutrino"                                                                  },
  { name = "!iscc",            type = "mctruth"                                         },
  { name = "!is_resonance",    type = "mctruth", parameters = [ 0 ]                     },
  { name = "single_photon",    type = "mctruth", parameters = [ "@gOre_threshold" ]     },
  { name = "no_charged_pions", type = "mctruth", parameters = [ "@pion_threshold" ]     },
  { name = "no_neutral_pions", type = "mctruth"                                         },
  { name = "no_electrons",     type = "mctruth", parameters = [ "@gOre_threshold" ]     },
  { name = "no_muons",         type = "mctruth", parameters = [ "@muon_threshold" ]     },
]
[[category]] # 3: NC π0 (Δ res)
cuts = [
  { name = "neutrino"                                                                  },
  { name = "!iscc",             type = "mctruth"                                        },
  { name = "is_resonance",      type = "mctruth", parameters = [ 0 ]                    },
  { name = "!no_neutral_pions", type = "mctruth"                                        },
]
[[category]] # 4: NC π0 (other)
cuts = [
  { name = "neutrino"                                                                  },
  { name = "!iscc",             type = "mctruth"                                        },
  { name = "!no_neutral_pions", type = "mctruth"                                        },
]
[[category]] # 5: NC π±
cuts = [
  { name = "neutrino"                                                                  },
  { name = "!iscc",             type = "mctruth"                                        },
  { name = "!no_charged_pions", type = "mctruth", parameters = [ "@pion_threshold" ]    },
]
[[category]] # 6: Other NC
cuts = [
  { name = "neutrino"                                                                  },
  { name = "!iscc",             type = "mctruth"                                        },
]
[[category]] # 7: CC νₑ
cuts = [
  { name = "neutrino"                                                                  },
  { name = "iscc",              type = "mctruth"                                        },
  { name = "!no_electrons",     type = "mctruth", parameters = [ "@gOre_threshold" ]    },
]
[[category]] # 8: Other CC
cuts = [
  { name = "neutrino"                                                                  },
  { name = "iscc",              type = "mctruth"                                        },
]
[[category]] # 9: Cosmic / unmatched
cuts = [
  { name = "!neutrino" },
]

