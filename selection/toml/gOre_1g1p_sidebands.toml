  { name = "!no_protons",        type = "reco", parameters = [ "@proton_threshold" ] },
  { name = "pi0_rejection",      type = "reco", parameters = [ "@gOre_primary_softmax_sideband", "@proton_primary_softmax_min", "@delta_mass_center", "@delta_mass_halfwidth", "@nonfid_gate" ] },
  { name = "no_second_shower",   type = "reco" },
]
branch = [
  { name = "cc",                   type = "mctruth" },
  { name = "pdg",                  type = "mctruth" },
