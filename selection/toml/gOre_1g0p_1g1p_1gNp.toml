[general]
output = "gOre_1g0p_1g1p_1gNp"
fsthresh = [
  "@gOre_threshold",
  "@gOre_threshold",
  "@muon_threshold",
  "@pion_threshold",
  "@proton_threshold",
]
pidfn = "gOre_pid"

[parameters]
gOre_threshold = 25 # MeV
muon_threshold = 25 # MeV
pion_threshold = 25 # MeV
proton_threshold = 50 # MeV
flash_low_t =  0.0 # µs
flash_high_t = 1.6 # µs
fiducial_xdist_pos = 50 # cm
fiducial_xdist_neg = 50 # cm
fiducial_ydist_pos = 50 # cm
fiducial_ydist_neg = 50 # cm
fiducial_zdist_pos = 50 # cm
fiducial_zdist_neg = 50 # cm
pion_mass_threshold = 0.4 # fraction of π0 mass
photon_vertex_resolution = 150 # cm
#flash_pe_neutron_scaling = 0.01
flash_pe_neutron_scaling = 0.019
#angle_neutron_scaling = 1.0
angle_neutron_scaling = 1.31

# -----------------------------------------------------------------------------
# Unified categories (truth-level, via upstream `[[category]]` mctruth syntax).
# Mirrors the per-event `mc_category` MCTruth variable in `vars_gOre.h:746`,
# AND folds in the spineplot precompute split of the 1γ1p signal by proton
# multiplicity. Indices match `gOre_1g1p.toml` spineplot's `category_labels`:
#   0: NC Δ→Nγ (1γ1p)
#   1: NC Δ→Nγ (other topo)
#   2: Other NC 1γXp post-FSI
#   3: NC π0 (Δ res)
#   4: NC π0 (other)
#   5: NC π±
#   6: Other NC
#   7: CC νₑ
#   8: Other CC
#   9: Cosmic / unmatched
# Selection writes the resulting label into the `category` branch
# (`type="true"`); spineplot reads it directly — no `gOre_category_idx`
# precompute remap needed. mctruth cuts auto-skip on data (nu_id<0); data
# samples set their category via spineplot `override_category`.
# -----------------------------------------------------------------------------
[[category]] # 0: NC Δ→Nγ (1γ1p) — NC, Δ resonance, 1γ + 0 lepton + 0 charged π + 0 π0 + 1p
cuts = [
  { name = "neutrino"                                                                  },
  { name = "!iscc",            type = "mctruth"                                         },
  { name = "is_resonance",     type = "mctruth", parameters = [ 0 ]                     },
  { name = "single_photon",    type = "mctruth", parameters = [ "@gOre_threshold" ]     },
  { name = "no_charged_pions", type = "mctruth", parameters = [ "@pion_threshold" ]     },
  { name = "no_neutral_pions", type = "mctruth"                                         },
  { name = "no_electrons",     type = "mctruth", parameters = [ "@gOre_threshold" ]     },
  { name = "no_muons",         type = "mctruth", parameters = [ "@muon_threshold" ]     },
  { name = "single_proton",    type = "mctruth", parameters = [ "@proton_threshold" ]   },
]

[[category]] # 1: NC Δ→Nγ (other proton multiplicity) — drop `single_proton` from cat 0
cuts = [
  { name = "neutrino"                                                                  },
  { name = "!iscc",            type = "mctruth"                                         },
  { name = "is_resonance",     type = "mctruth", parameters = [ 0 ]                     },
  { name = "single_photon",    type = "mctruth", parameters = [ "@gOre_threshold" ]     },
  { name = "no_charged_pions", type = "mctruth", parameters = [ "@pion_threshold" ]     },
  { name = "no_neutral_pions", type = "mctruth"                                         },
  { name = "no_electrons",     type = "mctruth", parameters = [ "@gOre_threshold" ]     },
  { name = "no_muons",         type = "mctruth", parameters = [ "@muon_threshold" ]     },
]

[[category]] # 2: Other NC 1γXp post-FSI — NC, NOT Δ res, single-photon topology
cuts = [
  { name = "neutrino"                                                                  },
  { name = "!iscc",            type = "mctruth"                                         },
  { name = "!is_resonance",    type = "mctruth", parameters = [ 0 ]                     },
  { name = "single_photon",    type = "mctruth", parameters = [ "@gOre_threshold" ]     },
  { name = "no_charged_pions", type = "mctruth", parameters = [ "@pion_threshold" ]     },
  { name = "no_neutral_pions", type = "mctruth"                                         },
  { name = "no_electrons",     type = "mctruth", parameters = [ "@gOre_threshold" ]     },
  { name = "no_muons",         type = "mctruth", parameters = [ "@muon_threshold" ]     },
]

[[category]] # 3: NC π0 (Δ res) — NC, Δ resonance, has at least one neutral pion
cuts = [
  { name = "neutrino"                                                                  },
  { name = "!iscc",             type = "mctruth"                                        },
  { name = "is_resonance",      type = "mctruth", parameters = [ 0 ]                    },
  { name = "!no_neutral_pions", type = "mctruth"                                        },
]

[[category]] # 4: NC π0 (other) — NC, has neutral pion (catches non-Δ; cat 3 already consumed Δ res)
cuts = [
  { name = "neutrino"                                                                  },
  { name = "!iscc",             type = "mctruth"                                        },
  { name = "!no_neutral_pions", type = "mctruth"                                        },
]

[[category]] # 5: NC π± — NC, has charged pion above threshold
cuts = [
  { name = "neutrino"                                                                  },
  { name = "!iscc",             type = "mctruth"                                        },
  { name = "!no_charged_pions", type = "mctruth", parameters = [ "@pion_threshold" ]    },
]

[[category]] # 6: Other NC
cuts = [
  { name = "neutrino"                                                                  },
  { name = "!iscc",             type = "mctruth"                                        },
]

[[category]] # 7: CC νₑ — CC with at least one final-state electron
cuts = [
  { name = "neutrino"                                                                  },
  { name = "iscc",              type = "mctruth"                                        },
  { name = "!no_electrons",     type = "mctruth", parameters = [ "@gOre_threshold" ]    },
]

[[category]] # 8: Other CC
cuts = [
  { name = "neutrino"                                                                  },
  { name = "iscc",              type = "mctruth"                                        },
]

[[category]] # 9: Cosmic / unmatched
cuts = [
  { name = "!neutrino" },
]

