# defaults / dummies for data — same pattern as icarus_disappearance.toml.
# Signal trees (signal_1g*) are sim_only=true and auto-skip per
# analysis.h:213.
# UNBLINDING NOTE: do NOT run with `disable=false` for `onbeam` until the
# analysis box is confirmed open for gOre 1γ1p. Verify production identity
# (run range / SAM dataset) and group convener sign-off first.
# -----------------------------------------------------------------------------
