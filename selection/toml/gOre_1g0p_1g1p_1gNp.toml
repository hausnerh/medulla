# mctruth + true fiducial/containment cuts below.
name = "signal_1g1p"
sim_only = true
mode = "true"
add_systematics = true
cut = [
    { name = "fiducial_cut",          type = "true"                                            },
    { name = "containment_cut",       type = "true"                                            },
    { name = "!iscc",                 type = "mctruth"                                         },
