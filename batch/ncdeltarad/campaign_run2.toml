# Enhanced-radiative NC Δ campaign (ReCAF2026-style run2 overlay chain).
# Copy, fill in the FILL_ME values, then:
#   python batch/ncdeltarad/orchestrate.py init batch/ncdeltarad/campaign_run2.toml
# Start with a pilot (gen_numjobs = 10); the orchestrator gates gen on pilot_check.py
# before scaling up.

[campaign]
name             = "ncdeltarad_run2_pilot"
# Local state, rendered XML, project.py book directories and the log.
workdir          = "/exp/icarus/data/users/FILL_ME/ncdeltarad/ncdeltarad_run2_pilot"
# Intermediate outputs (scratch is LRU-purged: fine for gen/g4/detsim/stage0).
pnfs_base        = "/pnfs/icarus/scratch/users/FILL_ME/ncdeltarad/ncdeltarad_run2_pilot"
# Stages flagged `persistent = true` (larcv, CAF) write here instead.
persistent_base  = "/pnfs/icarus/persistent/users/FILL_ME/ncdeltarad/ncdeltarad_run2_pilot"
# SAM definition of the run2 overlay input (data) files the production gen
# stage reads; one GENIE NC RES interaction is added to each overlay event.
overlay_inputdef = "FILL_ME"
gen_numjobs      = 10            # gen jobs; each reads maxfilesperjob overlay files (~38 events each)
# Feed the gen stage an explicit list of each file's replica under this
# prefix instead of letting SAM deliver the definition. SAM hands out a
# /pnfs/sbn/data_add replica of these files that no longer exists
# ([3011] No such file) -> every gen job failed to open its input.
# Prestage the definition first (samweb prestage-dataset) -- archive is tape.
input_location_prefer = "/pnfs/icarus/archive"

release          = "v10_06_00_13"
qual             = "e26:prof"
file_type        = "overlay"
br_gamma         = 0.663         # BR(Δ→Nγ) in the patched table = BR(Nπ0): 1:1 at the Δ pole
# genie_pdg_table = ""           # default: $GENIE/data/evgen/catalogues/pdg/genie_pdg_table.txt

resource         = "DEDICATED,OPPORTUNISTIC"
# Job container: rendered as the project's <os>; larbatch maps SL7 to
# /cvmfs/singularity.opensciencegrid.org/fermilab/fnal-wn-sl7:latest for the
# workers AND the SAM start/stop jobs. Needed when submitting from AL9: the
# start job otherwise lands on a bare AL9 node, where setup_icarus.sh fails
# ("UPS setup appears to have failed") and the DAG stops.
os               = "SL7"
# Extra jobsub_submit options for every stage's worker jobs (not the image).
jobsub_extra     = ""

# Where the orchestrator runs. jobsub (and so project.py --submit) needs the
# AL9 host: inside the SL7 container it fails with "HTCondorIOError: Failed
# communication with collector". On AL9, the gen-stage sidecar dump (ROOT +
# gallery) still needs the SL7 release, so it runs in the container through
# sl7_exec ({script} = a generated script that sets up icaruscode first).
# Leave sl7_exec unset only if you run the orchestrator inside SL7 with
# working jobsub.
sl7_exec = "/cvmfs/oasis.opensciencegrid.org/mis/apptainer/current/bin/apptainer exec -B /cvmfs,/exp,/nashome,/pnfs/icarus,/opt,/run/user,/etc/hostname,/etc/hosts,/etc/krb5.conf /cvmfs/singularity.opensciencegrid.org/fermilab/fnal-dev-sl7:latest bash {script}"

# Prepended to PATH / PYTHONPATH for every command the orchestrator runs, so
# project.py works on AL9 without per-shell exports (also under tmux/cron).
# Versions: larbatch as used by v10_06_00_13; icarusutil from
# `python3 -c "import experiment_utilities as e; print(e.__file__)"` in SL7.
path_prepend       = [ "/cvmfs/larsoft.opensciencegrid.org/products/larbatch/v01_61_01/bin",
                       "/cvmfs/fermilab.opensciencegrid.org/products/common/prd/sam_web_client/v3_6/NULL/bin" ]
pythonpath_prepend = [ "/cvmfs/larsoft.opensciencegrid.org/products/larbatch/v01_61_01/python",
                       "/cvmfs/icarus.opensciencegrid.org/products/icarus/icarusutil/v10_06_00_04/lib",
                       "/cvmfs/fermilab.opensciencegrid.org/products/common/prd/sam_web_client/v3_6/NULL/python" ]

min_good_fraction  = 0.95   # stage done when >= this fraction of jobs produced good output
max_makeup         = 2      # project.py --makeup rounds before giving up
accept_fraction    = 0.80   # after the makeups, accept the stage if at least this fraction is good
held_timeout_hours = 6
# notify_cmd = 'echo {body} | mail -s {subject} FILL_ME@fnal.gov'

# Resource requests are first guesses: take memory/disk/lifetime from the
# production XMLs for the same fcls, or from the pilot's job logs.
[[stage]]
name     = "gen"
fcl      = "simulation_genie_icarus_bnb_overlays_volDetEnclosure_fiducial_ncdeltarad.fcl"
datatier = "simulated"
memory   = 3000
lifetime = "8h"
maxfilesperjob = 5            # ~190 events per gen job; 10x CV signal needs ~140 jobs

[[stage]]
name     = "g4"
fcl      = "larg4_icarus_cosmics_sce.fcl"
datatier = "simulated"
memory   = 4000
lifetime = "24h"

[[stage]]
name     = "detsim"
fcl      = "detsim_2d_icarus_refactored_yzsim_overlay_Run4.fcl"
datatier = "detector-simulated"
memory   = 6000
lifetime = "12h"

[[stage]]
name     = "stage0"
fcl      = "stage0_run2_wcdnn_icarus_overlay.fcl"
datatier = "reconstructed"
memory   = 8000
lifetime = "24h"

# Every finished stage publishes <stage dir>/files.list (project.py's good
# outputs) and one <name>_files.list per [[stage.publish]] glob, searched only
# in the good jobs' output directories. stage1 and caf are the inputs of the
# GPU SPINE step, so they go to persistent_base.
[[stage]]
name       = "stage1"
fcl        = "stage1_run2_larcv_icarus_overlay.fcl"
datatier   = "reconstructed"
memory     = 6000
lifetime   = "12h"
persistent = true
# superaMC (icarus_analysis_superaMC) writes the larcv file with
# unique_filename; check the name on the pilot and adjust the glob.
publish    = [ { name = "larcv", glob = "*larcv*.root" } ]

[[stage]]
name       = "caf"
fcl        = "cafmakerjob_icarus_detsim2d_systtools_and_fluxwgt_overlay.fcl"
datatier   = "caf"
memory     = 4000
lifetime   = "8h"
ana        = true            # CAF output is not an art file: use project.py --checkana
persistent = true
publish    = [ { name = "flatcaf", glob = "*.flat.caf.root" },
               { name = "caf",     glob = "*.caf.root", exclude = "*.flat.caf.root" } ]

# When all stages are done: <persistent_base>/manifest.json (stage outdirs,
# counts, list paths) plus ncdeltarad_pdg_table.txt and campaign_config.json.
#
# SPINE needs a GPU node and is not run by the orchestrator. Optional
# [[external]] stages (shell commands) can still be chained after caf:
# submit_cmd runs once; check_cmd is polled (exit 0 done, 1 running, 2 failed);
# placeholders {workdir} {pnfs_base} {persistent_base} {name}.
