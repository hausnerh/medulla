# Systematics config for the gOre 1γ1p sidebands selection.
#
# Inputs:
#   - selection output from `medulla selection/toml/gOre_1g1p_sidebands.toml`
#     (file: gOre_1g1p_sidebands.root). All four reco trees + signal tree
#     present under events/<sample>/<tree>.
#   - cvext flat-CAF glob — same source used by every existing ICARUS sys toml.
#
# Strategy:
#   * cvext copy of each reco tree gets per-event multisim/multisigma/variation
#     weight columns appended (`action = 'add_weights'`).
#   * nominal copy carried as-is so plot-time code can pull an unweighted
#     reference column.
#   * offbeam / onbeam carried as-is.
#   * signal_1g1p (sim_only, true-mode) gets multisim/multisigma weights so
#     selection efficiency uncertainty can be tracked.
#   * [variations] block runs detsys on stage3 (= final 1γ1p selection)
#     against reco_leading_primary_gOre_shower_ke. Change `tree`/`variable`
#     to retarget; only one [variations] block per run.
#
# NB: this toml assumes the selection ROOT file does NOT carry `*_exposure`
# trees (the gOre_1g1p_sidebands selection toml does not set
# `add_exposure = true` on any tree). For POT normalization, add
# `add_exposure = true` to each `[[tree]]` in the selection toml, rerun
# medulla, then uncomment the `*_exposure` blocks at the bottom of this file.

[input]
path = 'gOre_1g1p_sidebands.root'
weights = '/pnfs/icarus/persistent/users/mueller/production/simulation/cvext/input*.flat.root'
use_additional_hash = true

[output]
path = 'gOre_1g1p_sidebands_sys.root'
histogram_destination = 'variations/'

# Variables that get sys histograms / covariance summaries. Add more as needed
# — each gets its own histogram set under `histogram_destination`.
[[sysvar]]
name = 'reco_leading_primary_gOre_shower_ke'
bins = [30, 0, 600]

[[sysvar]]
name = 'reco_delta_mass_P'
bins = [40, 800, 1800]

[[sysvar]]
name = 'reco_leading_primary_gOre_start_dedx'
bins = [40, 0, 10]

# Detsys variation block: runs `varNN` ratio against `nominal` on stage3.
# Only one [variations] block supported per run; pick the primary tree.
[variations]
keys = ['nominal', 'var00', 'var01', 'var02', 'var03m', 'var03p', 'var04', 'var05', 'var06', 'var07', 'var09m', 'var09p', 'var10m', 'var10p', 'var11', 'var12m', 'var12p', 'var13m', 'var13p']
origin = 'events/'
tree = 'selected_1g1p_stage3'
result_destination = 'detsys_results/'
variable = 'reco_leading_primary_gOre_shower_ke'
variable_length = true
bins = [0, 50, 100, 150, 200, 250, 300, 350, 400, 500, 600]
nuniverses = 10

# ----------------------------------------------------------------------------
# Tree copies / weight-attach for each stage of the 1γ1p chain.
# Pattern per tree: cvext -> events/full (add_weights); nominal/offbeam/onbeam -> copy.
# ----------------------------------------------------------------------------

# --- stage1: preselection ---
[[tree]]
origin = 'events/cvext/selected_1g1p_stage1'
destination = 'events/full/'
name = 'selected_1g1p_stage1'
action = 'add_weights'
table_types = ['multisim', 'multisigma', 'variation']

[[tree]]
origin = 'events/nominal/selected_1g1p_stage1'
destination = 'events/nominal/'
name = 'selected_1g1p_stage1'
action = 'copy'

[[tree]]
origin = 'events/offbeam/selected_1g1p_stage1'
destination = 'events/offbeam/'
name = 'selected_1g1p_stage1'
action = 'copy'

[[tree]]
origin = 'events/onbeam/selected_1g1p_stage1'
destination = 'events/onbeam/'
name = 'selected_1g1p_stage1'
action = 'copy'

# --- stage2: + π0 rejection ---
[[tree]]
