# Systematics config for the gOre 1γ1p sidebands selection.
#
# Local run target:
#   ./build/systematics/run_systematics systematics/toml/gOre_1g1p_sidebands.toml
#
# Inputs:
#   - hadd-ed grid selection output `output_gOre_1g1p.root`. All four reco
#     trees + signal tree present under events/<sample>/<tree>, with
#     `*_exposure` siblings (add_exposure=true on every tree in the
#     selection toml).
#   - cvext flat-CAF glob for weight lookup.
#
# Strategy:
#   * cvext copy of each reco tree gets per-event multisim/multisigma/variation
#     weight columns appended (`action = 'add_weights'`).
#   * cv copy carried as-is (nominal MC reference).
#   * offbeam / onbeam carried as-is.
#   * signal_1g1p (sim_only, true-mode) gets multisim/multisigma weights so
#     selection efficiency uncertainty can be tracked.
#   * [variations] block runs detsys on stage3 (= final 1γ1p selection)
#     against reco_leading_primary_gOre_shower_ke. Change `tree`/`variable`
#     to retarget; only one [variations] block per run.
#
# NB: the selection toml uses sample name `cv` (not `nominal`); every
# variations key + ordinate + nominal-copy [[tree]] block below uses `cv`.

[input]
path = 'output_gOre_1g1p.root'
weights = '/pnfs/icarus/persistent/users/mueller/production/simulation/cvext/*.flat.root'
use_additional_hash = true

[output]
path = 'output_gOre_1g1p_sys.root'
histogram_destination = 'variations/'

# Variables that get sys histograms / covariance summaries. Add more as needed
# — each gets its own histogram set under `histogram_destination`.
[[sysvar]]
name = 'reco_leading_primary_gOre_shower_ke'
bins = [30, 0, 600]

[[sysvar]]
name = 'reco_delta_mass_P'
bins = [40, 800, 1800]

[[sysvar]]
name = 'reco_leading_primary_gOre_start_dedx'
bins = [40, 0, 10]

[[sysvar]]
name = 'reco_n_protons'
bins = [5, 0, 5]

[[sysvar]]
name = 'reco_leading_primary_proton_ke'
bins = [25, 0, 500]

# --- non-fiducial Xγ + Np "outside-the-box" sideband, stages 1/2/3 ---
# stage1 is the largest region in the file; run_systematics may OOM here on a
# standard gpvm. If so, run Stage 3 on a high-memory node or switch the stage1
# events/full block below from add_weights to action='copy' (stat-only).
[[tree]]
origin = 'events/cvext/selected_nonfid_NgNp_stage1'
destination = 'events/full/'
name = 'selected_nonfid_NgNp_stage1'
action = 'add_weights'
table_types = ['multisim', 'multisigma', 'variation']

[[tree]]
origin = 'events/cv/selected_nonfid_NgNp_stage1'
destination = 'events/cv/'
name = 'selected_nonfid_NgNp_stage1'
action = 'copy'

[[tree]]
origin = 'events/offbeam/selected_nonfid_NgNp_stage1'
