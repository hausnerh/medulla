name = 'selected_1g1p_stage2'
action = 'copy'

[[tree]]
origin = 'events/offbeam/selected_1g1p_stage2'
destination = 'events/offbeam/'
name = 'selected_1g1p_stage2'
action = 'copy'

[[tree]]
origin = 'events/onbeam/selected_1g1p_stage2'
destination = 'events/onbeam/'
name = 'selected_1g1p_stage2'
action = 'copy'

# --- stage3: + e/γ separation (final) ---
[[tree]]
origin = 'events/cvext/selected_1g1p_stage3'
destination = 'events/full/'
name = 'selected_1g1p_stage3'
action = 'add_weights'
table_types = ['multisim', 'multisigma', 'variation']

[[tree]]
