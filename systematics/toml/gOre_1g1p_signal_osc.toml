# =============================================================================
# OSC (ICARUS run2+run4 ReCAF2026) variant — generated from systematics/toml/gOre_1g1p_signal_datamc.toml.
# Differences from the source, nothing else:
#   * [input]/[output] paths match the --sel-toml label (gOre_1g1p_signal_osc).
#   * [input].weights is a FILE LIST (weights_gOre_1g1p_signal_osc.txt, written into build/ by
#     the orchestrator from the selection toml's `cvext` globs). The osc CAFs sit
#     in nested */*/*.root dirs across two productions, which a single TChain
#     wildcard can't express.
#   * The old var00-13p detsys ([variations] + type='variation' [[sys]]) is
#     DROPPED: those samples don't exist in the osc production and the new unisim
#     detvars aren't wired yet. 'variation' stays in table_types -> empty
#     pass-through, so the plot configs' _variationTree still exists.
#   * events/cv/* copies dropped: osc has no separate nominal `cv` sample.
# =============================================================================
# Systematics config for the gOre 1γ1p sidebands selection.
#
# Local run target:
#   ./build/systematics/run_systematics systematics/toml/gOre_1g1p_sidebands.toml
#
# Inputs:
#   - hadd-ed grid selection output `output_gOre_1g1p.root`. All four reco
#     trees + signal tree present under events/<sample>/<tree>, with
#     `*_exposure` siblings (add_exposure=true on every tree in the
#     selection toml).
#   - cvext flat-CAF glob for weight lookup.
#
# Strategy:
#   * cvext copy of each reco tree gets per-event multisim/multisigma/variation
#     weight columns appended (`action = 'add_weights'`).
#   * cv copy carried as-is (nominal MC reference).
#   * offbeam / onbeam carried as-is.
#   * signal_1g1p (sim_only, true-mode) gets multisim/multisigma weights so
#     selection efficiency uncertainty can be tracked.
#   * [variations] block runs detsys on stage3 (= final 1γ1p selection)
#     against reco_leading_primary_gOre_shower_ke. Change `tree`/`variable`
#     to retarget; only one [variations] block per run.
#
# NB: the selection toml uses sample name `cv` (not `nominal`); every
# variations key + ordinate + nominal-copy [[tree]] block below uses `cv`.

[input]
path = 'output_gOre_1g1p_signal_osc.root'
weights = 'weights_gOre_1g1p_signal_osc.txt'
use_additional_hash = true

[output]
path = 'output_gOre_1g1p_signal_osc_sys.root'
histogram_destination = 'variations/'

# Variables that get sys histograms / covariance summaries. Add more as needed
# — each gets its own histogram set under `histogram_destination`.
[[sysvar]]
name = 'reco_leading_primary_gOre_shower_ke'
bins = [30, 0, 600]

[[sysvar]]
name = 'reco_delta_mass_P'
bins = [40, 800, 1800]

[[sysvar]]
name = 'reco_leading_primary_gOre_start_dedx'
bins = [40, 0, 10]

[[sysvar]]
name = 'reco_n_protons'
bins = [5, 0, 5]

[[sysvar]]
name = 'reco_leading_primary_proton_ke'
bins = [25, 0, 500]

# ----------------------------------------------------------------------------
# Tree copies / weight-attach for each stage of the 1γ1p chain.
# Pattern per tree: cvext -> events/full (add_weights); nominal/offbeam/onbeam -> copy.
# ----------------------------------------------------------------------------

# --- stage1: preselection ---
[[tree]]
origin = 'events/cvext/selected_1g1p_stage1'
destination = 'events/full/'
name = 'selected_1g1p_stage1'
action = 'add_weights'
table_types = ['multisim', 'multisigma', 'variation']

[[tree]]
origin = 'events/offbeam/selected_1g1p_stage1'
destination = 'events/offbeam/'
name = 'selected_1g1p_stage1'
action = 'copy'

[[tree]]
origin = 'events/onbeam/selected_1g1p_stage1'
destination = 'events/onbeam/'
name = 'selected_1g1p_stage1'
action = 'copy'

# --- stage2: + π0 rejection ---
[[tree]]
origin = 'events/cvext/selected_1g1p_stage2'
destination = 'events/full/'
name = 'selected_1g1p_stage2'
action = 'add_weights'
table_types = ['multisim', 'multisigma', 'variation']

[[tree]]
origin = 'events/offbeam/selected_1g1p_stage2'
destination = 'events/offbeam/'
name = 'selected_1g1p_stage2'
action = 'copy'

[[tree]]
origin = 'events/onbeam/selected_1g1p_stage2'
destination = 'events/onbeam/'
name = 'selected_1g1p_stage2'
action = 'copy'

# --- stage3: + e/γ separation (final) ---
[[tree]]
origin = 'events/cvext/selected_1g1p_stage3'
destination = 'events/full/'
name = 'selected_1g1p_stage3'
action = 'add_weights'
table_types = ['multisim', 'multisigma', 'variation']

[[tree]]
origin = 'events/offbeam/selected_1g1p_stage3'
destination = 'events/offbeam/'
name = 'selected_1g1p_stage3'
action = 'copy'

[[tree]]
origin = 'events/onbeam/selected_1g1p_stage3'
destination = 'events/onbeam/'
name = 'selected_1g1p_stage3'
action = 'copy'

