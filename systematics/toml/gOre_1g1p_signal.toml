# Signal-only systematics. Companion to gOre_1g1p_sidebands.toml: that one
# wrote the 4 reco trees + detsys to output_gOre_1g1p_sys.root and crashed
# before signal_1g1p. This toml processes signal_1g1p alone, writes to a
# separate output file. Do NOT hadd with output_gOre_1g1p_sys.root — POT /
# Livetime / detsys histograms would be summed by hadd and corrupt the
# normalization. Spineplot configs for signal-efficiency take --input
# pointing at this file directly; data/MC sideband configs keep pointing at
# output_gOre_1g1p_sys.root.
#
# Drops [variations] + all [[sys]] type='variation' entries since detsys is
# stage3-only and already produced in the first sys file.

[input]
path = 'output_gOre_1g1p.root'
weights = '/pnfs/icarus/persistent/users/mueller/production/simulation/cvext/*.flat.root'
use_additional_hash = true

[output]
path = 'output_gOre_1g1p_signal_sys.root'
histogram_destination = 'variations/'

# Sysvars restricted to branches that actually exist on signal_1g1p.
# Selection toml signal branch list: n_primary_showers, n_protons,
# vertex_x/y/z, leading_primary_gOre.{shower_ke,polar_angle},
# leading_primary_proton.ke. true_neutrino_energy from the mctruth block.
[[sysvar]]
name = 'reco_leading_primary_gOre_shower_ke'
bins = [30, 0, 600]

[[sysvar]]
name = 'reco_leading_primary_proton_ke'
bins = [25, 0, 500]

[[sysvar]]
name = 'reco_n_protons'
bins = [5, 0, 5]

[[sysvar]]
name = 'true_neutrino_energy'
bins = [40, 0, 4]

# --- signal tree (true-mode, MC only) ---
[[tree]]
origin = 'events/cvext/signal_1g1p'
destination = 'events/full/'
name = 'signal_1g1p'
action = 'add_weights'
table_types = ['multisim', 'multisigma']

[[tree]]
origin = 'events/cvext/signal_1g1p_exposure'
destination = 'events/full/'
name = 'signal_1g1p_exposure'
action = 'copy'

[[tree]]
origin = 'events/cv/signal_1g1p'
destination = 'events/cv/'
name = 'signal_1g1p'
action = 'copy'

[[tree]]
origin = 'events/cv/signal_1g1p_exposure'
destination = 'events/cv/'
name = 'signal_1g1p_exposure'
action = 'copy'

