# Systematics config for gOre 1g1p: GENIE multisim/multisigma + flux
# multisim + detector-variation splines. Produces `gOre_1g1p_sys.root`
# containing:
#   events/cvext/selected_1g1p                        (copied w/ full branches)
#   events/cvext/selected_1g1p_multisimTree           (GENIE/flux multisim)
#   events/cvext/selected_1g1p_multisigmaTree         (GENIE multisigma)
#   events/cvext/selected_1g1p_variationTree          (detsys splines)
#   events/cvext/selected_1g1p_nonmatched             (cvext events w/ no weights)
#   events/cvext/selected_1g1p_exposure               (POT/Livetime TTree)
#   events/cv/selected_1g1p                           (nominal-detector copy)
#   events/cv/selected_1g1p_exposure
#   variations/                                       (detsys histograms/splines)
#   detsys_results/                                   (per-variable detsys results)
#
# To plot: spineplot base config points `systematics = ['selected_1g1p_multisimTree',
# 'selected_1g1p_multisigmaTree', 'selected_1g1p_variationTree']` so Systematic
# combine-recipe `pattern = '.*'` sums all three families into one total band.

[input]
path = 'gOre_1g0p_1g1p_1gNp.root'
weights = '/pnfs/icarus/persistent/users/mueller/production/simulation/cvext/*.flat.root'
use_additional_hash = true

[output]
path = 'gOre_1g1p_sys.root'
histogram_destination = 'variations/'

# Spectrum used to bin detsys ratio histograms for spline construction.
# Must be a branch in selected_1g1p (reco-level shower KE — captures
# detector-response sensitivity for shower-led selection).
[[sysvar]]
name = 'reco_leading_primary_gOre_shower_ke'
bins = [25, 0, 1000]

[variations]
keys = ['cv', 'var00', 'var01', 'var02', 'var03m', 'var03p', 'var04', 'var05', 'var06', 'var07', 'var09m', 'var09p', 'var10m', 'var10p', 'var11', 'var12m', 'var12p', 'var13m', 'var13p']
origin = 'events/'
tree = 'selected_1g1p'
result_destination = 'detsys_results/'
variable = 'reco_leading_primary_gOre_shower_ke'
variable_length = true
bins = [0, 25, 50, 75, 100, 150, 200, 250, 300, 400, 500, 700, 1000]
nuniverses = 100

# -------- Tree copies + weight attachment --------

[[tree]]
origin = 'events/cv/selected_1g1p'
destination = 'events/cv/'
name = 'selected_1g1p'
action = 'copy'

[[tree]]
origin = 'events/cv/selected_1g1p_exposure'
destination = 'events/cv/'
name = 'selected_1g1p_exposure'
action = 'copy'

[[tree]]
origin = 'events/cvext/selected_1g1p'
destination = 'events/cvext/'
name = 'selected_1g1p'
action = 'add_weights'
table_types = ['multisim', 'multisigma', 'variation']

[[tree]]
origin = 'events/cvext/selected_1g1p_exposure'
destination = 'events/cvext/'
name = 'selected_1g1p_exposure'
action = 'copy'

[[tree]]
origin = 'events/cvext/signal_1g1p'
destination = 'events/cvext/'
name = 'signal_1g1p'
action = 'copy'

[[tree]]
origin = 'events/cvext/signal_1g1p_exposure'
destination = 'events/cvext/'
name = 'signal_1g1p_exposure'
action = 'copy'

# -------- Detector-variation systematics --------
