# CC + Xγ + 1p sideband, stage 3 (+ shower-ID cuts).
# Adds the same start_dedx + directional_spread + photon_softmax cuts
# used in the NC signal region. Validates the photon-shower
# identification on a CC-tagged sample where the truth photon
# parentage is a mix of primary (CC radiative Δ) and secondary (CC π0
# → 2γ with one photon retained as the leading shower).
# Subleading-shower veto is INTENTIONALLY ABSENT so 2γ events still
# contribute.

[[this_includes]]
file = 'configurations/analyses/icarus/gOre_cc_Xg1p_datamc.toml'

[output]
path = '/exp/icarus/app/users/hhausner/plots/gOre_cc_Xg1p/stage3_shower_id_datamc'

[samples.mc]
presel = "(reco_flash == 1) & (reco_fiducial == 1) & (reco_containment == 1) & (reco_leading_primary_gOre_primary_softmax > 0.9991) & (reco_leading_primary_proton_primary_softmax > 0.9513) & (reco_delta_mass_P > 1172.3) & (reco_delta_mass_P < 1291.7) & (reco_leading_primary_gOre_start_dedx > 4.07) & (reco_leading_primary_gOre_directional_spread < 0.037) & (reco_leading_primary_gOre_photon_softmax > 0.9225)"

[samples.onbeam]
presel = "(reco_flash == 1) & (reco_fiducial == 1) & (reco_containment == 1) & (reco_leading_primary_gOre_primary_softmax > 0.9991) & (reco_leading_primary_proton_primary_softmax > 0.9513) & (reco_delta_mass_P > 1172.3) & (reco_delta_mass_P < 1291.7) & (reco_leading_primary_gOre_start_dedx > 4.07) & (reco_leading_primary_gOre_directional_spread < 0.037) & (reco_leading_primary_gOre_photon_softmax > 0.9225)"
