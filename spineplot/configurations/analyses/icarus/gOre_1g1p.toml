# Reproduce run_analysis_gOre_NEW.cc final-cut plots for 1g1p with a
# total systematic uncertainty band. Input is the output of run_systematics
# on `gOre_1g0p_1g1p_1gNp.root` (tree events/cvext/selected_1g1p +
# selected_1g1p_multisimTree/multisigmaTree universe weight dirs).

[[this_includes]]
file = 'configurations/common/styles.toml'

[analysis]
ordinate_sample = 'mc'
# `true_category` is now produced directly by selection (`[[category]]`
# blocks in `gOre_1g0p_1g1p_1gNp.toml` mix reco fiducial/containment
# with mctruth NC/Δ-res/topology cuts). The old precompute remap of
# `true_mc_category` × `true_n_protons` is retired — the indices below
# already match the selection-side category order.
category_branch = 'true_category'
category_assignment = [[0], [1], [2], [3], [4], [5], [6], [7], [8]]
category_labels = [
  'NC $\Delta{\to}N\gamma$ (1$\gamma$1p)',
  'NC $\Delta{\to}N\gamma$ (Other Topo.)',
  'Other NC 1$\gamma$Xp Post-FSI',
  'NC $\pi^0$ ($\Delta$ Res)',
  'NC $\pi^0$ (Other)',
  'NC $\pi^{\pm}$',
  'Other NC',
  'CC e',
  'Other CC',
]
category_colors = ['C0', 'C9', 'C1', 'C2', 'C3', 'C4', 'C5', 'C6', 'C7']
category_types = ['histogram', 'histogram', 'histogram', 'histogram', 'histogram', 'histogram', 'histogram', 'histogram', 'histogram']

[samples.mc]
key = 'cvext'
exposure_type = 'pot'
trees = ['selected_1g1p']
systematics = ['selected_1g1p_multisimTree', 'selected_1g1p_multisigmaTree', 'selected_1g1p_variationTree']
target_pot = 4.64e20
print_sys = true
# Selection-side `[[category]]` index 9 (cosmic / `!neutrino`) is below
# the assignment list and is dropped by spineplot. cvext is pure MC — no
# real cosmic — so the drop is benign.
fillna = 8

[samples.mc.precompute]
reco_delta_mass_P_dev = "abs(reco_delta_mass_P - 1232)"
# Dummy 1-for-every-event branch, unique key from reco_gOre_topology so
# the n_selected Variable gets its own slot in Systematic._variables and
# its own covariance entry. Without this the cov key collides with
# reco_gOre_topology (nbins=2) and yerr length mismatches at draw time.
n_selected_flag = "0*reco_gOre_topology + 1"

# Presel + output.path defined per-stage in wrapper configs:
#   gOre_1g1p_stage1.toml (baseline only)
#   gOre_1g1p_stage2.toml (+ pi0 rejection)
#   gOre_1g1p_stage3.toml (+ e/gamma separation — full final cut)

# Collapse every per-knob covariance into one "total" band per variable.
# Covariance key produced: `total_<variable_name>` (systematic.py:275).
[[systematic_recipe]]
name = 'total'
label = 'Total syst.'
pattern = '.*'

# -----------------------------------------------------------------------------
# Variables — mirror run_analysis_gOre_NEW.cc:358-433.
# Categorical vars (true_interaction_type/_mode, true_baryon_res_code,
# true_mc_category, true_category) omitted — they need per-bin text labels
# that spineplot's Variable class does not support.
# -----------------------------------------------------------------------------

