# Reproduce run_analysis_gOre_NEW.cc final-cut plots for 1g1p with a
# total systematic uncertainty band. Input is the output of run_systematics
# on `gOre_1g0p_1g1p_1gNp.root` (tree events/cvext/selected_1g1p +
# selected_1g1p_multisimTree/multisigmaTree universe weight dirs).

[[this_includes]]
file = 'configurations/common/styles.toml'

[output]
path = '/exp/icarus/app/users/hhausner/plots/gOre_1g1p'

[analysis]
ordinate_sample = 'mc'
category_branch = 'gOre_category_idx'
category_assignment = [[0], [1], [2], [3], [4], [5], [6], [7], [8]]
category_labels = [
  'NC $\Delta{\to}N\gamma$ (1$\gamma$1p)',
  'NC $\Delta{\to}N\gamma$ (Other Topo.)',
  'Other NC 1$\gamma$Xp Post-FSI',
  'NC $\pi^0$ ($\Delta$ Res)',
  'NC $\pi^0$ (Other)',
  'NC $\pi^{\pm}$',
  'Other NC',
  'CC e',
  'Other CC',
]
category_colors = ['C0', 'C9', 'C1', 'C2', 'C3', 'C4', 'C5', 'C6', 'C7']
category_types = ['histogram', 'histogram', 'histogram', 'histogram', 'histogram', 'histogram', 'histogram', 'histogram', 'histogram']

[samples.mc]
key = 'cvext'
exposure_type = 'pot'
trees = ['selected_1g1p']
systematics = ['selected_1g1p_multisimTree', 'selected_1g1p_multisigmaTree']
print_sys = true

# run_analysis_gOre_NEW.cc:655-658 maps true_mc_category==0 into 2 bins
# split by true_n_protons. Express as a single flat category index:
#   base = true_mc_category + 1  (gives 1 for cat==0, 2..8 for cat 1..7)
#   subtract (cat==0 & protons==1) to move 1g1p signal events to index 0
[samples.mc.precompute]
gOre_category_idx = "(true_mc_category + 1) - ((true_mc_category == 0) & (true_n_protons == 1))"
reco_delta_mass_P_dev = "abs(reco_delta_mass_P - 1232)"

# Final-cut state in run_analysis_gOre_NEW.cc:
#   baseline (fiducial / containment / flash / gOre_topology / single_proton)
#   is already applied by the selection binary — only stage-2 pi0 rejection
#   and stage-3 e/gamma separation remain. Cut values from lines 263-271.
presel = "(reco_subleading_primary_gOre_shower_ke <= 0) & (reco_leading_primary_gOre_primary_softmax > 0.9991) & (reco_leading_primary_proton_primary_softmax > 0.9513) & (reco_delta_mass_P_dev < 59.7) & (reco_leading_primary_gOre_start_dedx > 4.07) & (reco_leading_primary_gOre_directional_spread < 0.037) & (reco_leading_primary_gOre_photon_softmax > 0.9225)"

# Collapse every per-knob covariance into one "total" band per variable.
# Covariance key produced: `total_<variable_name>` (systematic.py:275).
[[systematic_recipe]]
name = 'total'
label = 'Total syst.'
pattern = '.*'

# -----------------------------------------------------------------------------
# Variables — mirror run_analysis_gOre_NEW.cc:358-433.
# Categorical vars (true_interaction_type/_mode, true_baryon_res_code,
# true_mc_category, true_category) omitted — they need per-bin text labels
# that spineplot's Variable class does not support.
# -----------------------------------------------------------------------------

