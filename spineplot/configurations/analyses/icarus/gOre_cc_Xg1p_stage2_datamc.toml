# CC + Xγ + 1p sideband, stage 2 (+ softmaxes + Δ-mass window).
# Tightens the leading photon + proton primary identification and the
# Δ-mass reconstruction. Subleading-shower veto is INTENTIONALLY ABSENT
# so both 1γ (CC radiative-like) and 2γ (CC π0) events remain in the
# sample.

[[this_includes]]
file = 'configurations/analyses/icarus/gOre_cc_Xg1p_datamc.toml'

[output]
path = '/exp/icarus/app/users/hhausner/plots/gOre_cc_Xg1p/stage2_kinematic_datamc'

[samples.mc]
presel = "(reco_flash == 1) & (reco_fiducial == 1) & (reco_containment == 1) & (reco_leading_primary_gOre_primary_softmax > 0.9991) & (reco_leading_primary_proton_primary_softmax > 0.9513) & (reco_delta_mass_P > 1172.3) & (reco_delta_mass_P < 1291.7)"

[samples.onbeam]
presel = "(reco_flash == 1) & (reco_fiducial == 1) & (reco_containment == 1) & (reco_leading_primary_gOre_primary_softmax > 0.9991) & (reco_leading_primary_proton_primary_softmax > 0.9513) & (reco_delta_mass_P > 1172.3) & (reco_delta_mass_P < 1291.7)"
