[[style]]
name = 'selected_icarus_1g1p'
style_sheet = "styles/muon2024.mplstyle"
markers = ['o', '^', 's', 'P', 'D']
default_figsize = [6.4,4.8]
title = '$\bf{ICARUS}$ NC $\Delta{\to}N\gamma$ ($1\gamma 1p$)'
mark_pot = true
mark_preliminary = '$\bf{ICARUS}$ Work-in-Progress'
plot_kwargs = {'histtype' = 'barstacked', 'stacked' = true}

# CC Xγ+1p sideband: same look as selected_icarus_1g1p but a CC-tagged
# title, so the cc_Xg1p stage plots are not mislabelled as the NC signal.
[[style]]
name = 'selected_icarus_cc_Xg1p'
style_sheet = "styles/muon2024.mplstyle"
markers = ['o', '^', 's', 'P', 'D']
# Wider than the 6.4x4.8 default: the muon2024 sheet sets axes.titlesize=36,
# and this CC title is the longest ICARUS title, so it overflows a 6.4" canvas
# and clips on both sides (savefig has no bbox_inches='tight'). 9x6 gives the
# title comfortable horizontal margin.
default_figsize = [9.0,6.0]
title = '$\bf{ICARUS}$ CC $X\gamma + 1p$ Sideband'
mark_pot = true
mark_preliminary = '$\bf{ICARUS}$ Work-in-Progress'
plot_kwargs = {'histtype' = 'barstacked', 'stacked' = true}

# Non-fiducial Xγ+Np "outside-the-box" sideband: same look, a distinct title so
# the max-stats non-fiducial photon+proton plots are not confused with either
# the NC signal or the CC sideband.
[[style]]
name = 'selected_icarus_nonfid_XgNp'
style_sheet = "styles/muon2024.mplstyle"
markers = ['o', '^', 's', 'P', 'D']
default_figsize = [9.0,6.0]
title = '$\bf{ICARUS}$ Non-Fiducial $X\gamma + Xp$ Sideband'
mark_pot = true
mark_preliminary = '$\bf{ICARUS}$ Work-in-Progress'
plot_kwargs = {'histtype' = 'barstacked', 'stacked' = true}

